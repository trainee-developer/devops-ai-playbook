<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1075" width="1280" height="1075" role="img" aria-label="AWS infrastructure architecture for boutique-microservices: VPC with three public subnets, EKS cluster, ECR repositories, IAM roles and Kubernetes workloads">
  <style>
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .m    { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .h1   { font-size: 23px; font-weight: 700; fill: #232F3E; }
    .h2   { font-size: 13px; fill: #5A6B7B; }
    .box  { font-size: 13.5px; font-weight: 700; fill: #232F3E; }
    .sub  { font-size: 12.5px; font-weight: 700; fill: #232F3E; }
    .lbl  { font-size: 11.5px; fill: #232F3E; }
    .mut  { font-size: 10.5px; fill: #5A6B7B; }
    .tiny { font-size: 10px; fill: #5A6B7B; }
    .chip { font-size: 11.5px; font-weight: 700; fill: #FFFFFF; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8C4FFF"/>
    </marker>
    <marker id="arwm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="1075" fill="#FFFFFF"/>

  <!-- ===== Header ===== -->
  <text class="h1" x="32" y="42">AWS Infrastructure &#8212; boutique-microservices</text>
  <text class="h2" x="32" y="66">Built by projects/Infrastructure (Terraform)  &#183;  VPC  &#183;  EKS  &#183;  ECR  &#183;  Argo CD + monitoring</text>
  <rect x="1060" y="26" width="188" height="30" rx="15" fill="#FFF3E6" stroke="#ED7100"/>
  <text class="lbl" x="1154" y="46" text-anchor="middle" fill="#B35A00">Region: us-east-1</text>

  <!-- ===== AWS Cloud ===== -->
  <rect x="32" y="88" width="1216" height="944" rx="12" fill="#FCFCFD" stroke="#232F3E" stroke-width="1.5"/>
  <text class="lbl" x="56" y="115" font-weight="700">AWS Cloud</text>

  <!-- ===== EKS Control Plane ===== -->
  <rect x="56" y="130" width="1168" height="96" rx="8" fill="#FFF6EF" stroke="#ED7100" stroke-width="1.5"/>
  <text class="box" x="76" y="157">Amazon EKS &#8212; Control Plane  (fully managed by AWS, runs in an AWS-owned VPC)</text>
  <text class="mut" x="76"  y="182">Cluster name: eks-cluster</text>
  <text class="mut" x="76"  y="202">Kubernetes version 1.34</text>
  <text class="mut" x="460" y="182">endpoint_public_access = true   &#8592; kubectl works from your laptop</text>
  <text class="mut" x="460" y="202">endpoint_private_access = false</text>
  <text class="mut" x="900" y="182">OIDC provider registered in IAM</text>
  <text class="mut" x="900" y="202">&#8594; enables IRSA (pods assume roles)</text>

  <!-- control plane -> VPC -->
  <line x1="456" y1="226" x2="456" y2="248" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwm)"/>
  <text class="tiny" x="470" y="244">control-plane ENIs are placed into your subnets</text>

  <!-- ===== VPC ===== -->
  <rect x="56" y="250" width="800" height="542" rx="10" fill="#FAF7FF" stroke="#8C4FFF" stroke-width="1.5"/>
  <rect x="72" y="264" width="196" height="24" rx="12" fill="#8C4FFF"/>
  <text class="chip" x="170" y="281" text-anchor="middle">VPC &#183; EKS-Demo-VPC</text>
  <text class="m lbl" x="282" y="281" fill="#4B2E83" font-weight="700">10.1.0.0/16</text>
  <text class="mut" x="72" y="306">enable_dns_support = true  &#183;  enable_dns_hostnames = true   (both required by EKS)</text>

  <!-- Internet Gateway -->
  <rect x="80" y="320" width="360" height="58" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text class="sub" x="96" y="343">Internet Gateway</text>
  <text class="mut" x="96" y="363">EKS-Demo-VPC-igw   &#8597;  public internet</text>

  <!-- Route table -->
  <rect x="472" y="320" width="360" height="58" rx="6" fill="#FFFFFF" stroke="#8C4FFF"/>
  <text class="sub" x="488" y="343">Public Route Table</text>
  <text class="m mut" x="488" y="363">local &#8594; 10.1.0.0/16    &#183;    0.0.0.0/0 &#8594; igw</text>
  <line x1="470" y1="349" x2="446" y2="349" stroke="#8C4FFF" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- route table bus down to subnets -->
  <line x1="652" y1="378" x2="652" y2="404" stroke="#8C4FFF" stroke-width="1.5"/>
  <line x1="196" y1="404" x2="716" y2="404" stroke="#8C4FFF" stroke-width="1.5"/>
  <line x1="196" y1="404" x2="196" y2="430" stroke="#8C4FFF" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="456" y1="404" x2="456" y2="430" stroke="#8C4FFF" stroke-width="1.5" marker-end="url(#arw)"/>
  <line x1="716" y1="404" x2="716" y2="430" stroke="#8C4FFF" stroke-width="1.5" marker-end="url(#arw)"/>

  <!-- Subnet 1 -->
  <rect x="80" y="432" width="232" height="250" rx="8" fill="#F6FBF0" stroke="#7AA116" stroke-width="1.5"/>
  <text class="sub" x="96" y="458" fill="#33471F">Public Subnet 1</text>
  <text class="m lbl" x="96" y="478" fill="#5A6B7B">10.1.1.0/24</text>
  <text class="mut" x="96" y="497">AZ: us-east-1a</text>
  <line x1="96" y1="510" x2="296" y2="510" stroke="#DCE8CC"/>
  <rect x="96" y="524" width="200" height="142" rx="6" fill="#FFF6EF" stroke="#ED7100"/>
  <text class="lbl" x="112" y="548" font-weight="700">EC2 Worker Node</text>
  <text class="m mut" x="112" y="568" fill="#232F3E">m7i-flex.large</text>
  <text class="mut" x="112" y="587">capacity: ON_DEMAND</text>
  <text class="mut" x="112" y="605">20 GiB EBS root *</text>
  <text class="mut" x="112" y="623">public IP assigned</text>
  <text class="tiny" x="112" y="647" font-style="italic">every pod runs here</text>

  <!-- Subnet 2 -->
  <rect x="340" y="432" width="232" height="250" rx="8" fill="#F6FBF0" stroke="#7AA116" stroke-width="1.5"/>
  <text class="sub" x="356" y="458" fill="#33471F">Public Subnet 2</text>
  <text class="m lbl" x="356" y="478" fill="#5A6B7B">10.1.2.0/24</text>
  <text class="mut" x="356" y="497">AZ: us-east-1b</text>
  <line x1="356" y1="510" x2="556" y2="510" stroke="#DCE8CC"/>
  <rect x="356" y="524" width="200" height="142" rx="6" fill="#FFFFFF" stroke="#C9D8B4" stroke-dasharray="5 4"/>
  <text class="lbl" x="456" y="562" text-anchor="middle" fill="#7A8B6B" font-weight="700">no node yet</text>
  <text class="mut" x="456" y="584" text-anchor="middle">scale-out capacity</text>
  <text class="mut" x="456" y="602" text-anchor="middle">(max_size = 2)</text>
  <text class="tiny" x="456" y="630" text-anchor="middle">also eligible for</text>
  <text class="tiny" x="456" y="646" text-anchor="middle">load balancers</text>

  <!-- Subnet 3 -->
  <rect x="600" y="432" width="232" height="250" rx="8" fill="#F6FBF0" stroke="#7AA116" stroke-width="1.5"/>
  <text class="sub" x="616" y="458" fill="#33471F">Public Subnet 3</text>
  <text class="m lbl" x="616" y="478" fill="#5A6B7B">10.1.3.0/24</text>
  <text class="mut" x="616" y="497">AZ: us-east-1c</text>
  <line x1="616" y1="510" x2="816" y2="510" stroke="#DCE8CC"/>
  <rect x="616" y="524" width="200" height="142" rx="6" fill="#FFFFFF" stroke="#C9D8B4" stroke-dasharray="5 4"/>
  <text class="lbl" x="716" y="562" text-anchor="middle" fill="#7A8B6B" font-weight="700">no node yet</text>
  <text class="mut" x="716" y="584" text-anchor="middle">scale-out capacity</text>
  <text class="mut" x="716" y="602" text-anchor="middle">(max_size = 2)</text>
  <text class="tiny" x="716" y="630" text-anchor="middle">also eligible for</text>
  <text class="tiny" x="716" y="646" text-anchor="middle">load balancers</text>

  <!-- subnet notes -->
  <rect x="80" y="698" width="752" height="74" rx="6" fill="#FFFFFF" stroke="#E3DAF7"/>
  <text class="mut" x="96" y="720" fill="#4B2E83" font-weight="700">All three subnets are PUBLIC &#8212; there is no NAT gateway. Each is tagged so EKS can find it:</text>
  <text class="m mut" x="96" y="740">kubernetes.io/role/elb = 1   &#183;   kubernetes.io/cluster/eks-cluster = owned   &#183;   map_public_ip_on_launch = true</text>
  <text class="mut" x="96" y="760">Managed node group  eks-node-group   &#183;   min 1  &#183;  desired 1  &#183;  max 2   &#183;   rolling update: max_unavailable = 1</text>

  <!-- ===== ECR ===== -->
  <rect x="888" y="250" width="336" height="250" rx="10" fill="#FFF6EF" stroke="#ED7100" stroke-width="1.5"/>
  <text class="box" x="908" y="279">Amazon ECR</text>
  <text class="mut" x="908" y="297">7 private container image repositories</text>
  <line x1="908" y1="309" x2="1204" y2="309" stroke="#F5D9C2"/>
  <text class="m lbl" x="908"  y="332">frontend</text>
  <text class="m lbl" x="908"  y="354">gateway</text>
  <text class="m lbl" x="908"  y="376">auth</text>
  <text class="m lbl" x="908"  y="398">order-service</text>
  <text class="m lbl" x="1066" y="332">orders</text>
  <text class="m lbl" x="1066" y="354">product-service</text>
  <text class="m lbl" x="1066" y="376">user-service</text>
  <text class="mut" x="908" y="428">scan_on_push = true  (CVE scan on every push)</text>
  <text class="mut" x="908" y="448">image_tag_mutability = MUTABLE</text>
  <text class="mut" x="908" y="468">force_delete = true</text>
  <text class="tiny" x="908" y="490" font-style="italic">&#8592; worker nodes pull images from here</text>
  <line x1="886" y1="470" x2="860" y2="470" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arwm)"/>

  <!-- ===== IAM ===== -->
  <rect x="888" y="534" width="336" height="258" rx="10" fill="#FEF3F5" stroke="#DD344C" stroke-width="1.5"/>
  <text class="box" x="908" y="563">IAM  (global &#8212; not inside the VPC)</text>
  <text class="mut" x="908" y="581">3 roles created by Terraform</text>
  <line x1="908" y1="593" x2="1204" y2="593" stroke="#F7D5DC"/>
  <text class="m lbl" x="908" y="615" font-weight="700">eks-cluster-cluster-role</text>
  <text class="tiny" x="908" y="631">AmazonEKSClusterPolicy &#8212; assumed by the control plane</text>
  <text class="m lbl" x="908" y="659" font-weight="700">eks-cluster-node-role</text>
  <text class="tiny" x="908" y="675">WorkerNodePolicy + CNI_Policy + ECR ReadOnly</text>
  <text class="tiny" x="908" y="689">assumed by the EC2 worker nodes</text>
  <text class="m lbl" x="908" y="717" font-weight="700">eks-cluster-ebs-csi-irsa</text>
  <text class="tiny" x="908" y="733">AmazonEBSCSIDriverPolicy, trusted through OIDC</text>
  <text class="tiny" x="908" y="747">only for service account</text>
  <text class="m tiny" x="908" y="763">kube-system/ebs-csi-controller-sa</text>
  <line x1="886" y1="660" x2="860" y2="660" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arwm)"/>

  <!-- VPC -> workloads -->
  <line x1="456" y1="792" x2="456" y2="822" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arwm)"/>
  <text class="tiny" x="470" y="812">all pods below are scheduled onto that one worker node</text>

  <!-- ===== Kubernetes workloads ===== -->
  <rect x="56" y="824" width="1168" height="180" rx="10" fill="#F4F8FE" stroke="#326CE5" stroke-width="1.5"/>
  <text class="box" x="76" y="852">Kubernetes workloads &#8212; installed by Terraform (module.argocd) through Helm</text>

  <rect x="80" y="866" width="352" height="122" rx="6" fill="#FFFFFF" stroke="#C7DAF7"/>
  <rect x="96" y="880" width="96" height="22" rx="11" fill="#326CE5"/>
  <text class="chip" x="144" y="896" text-anchor="middle">ns: argocd</text>
  <text class="lbl" x="96" y="926" font-weight="700">Argo CD  (Helm chart 6.7.0)</text>
  <text class="mut" x="96" y="944">Service type: ClusterIP &#8212; not exposed publicly</text>
  <text class="mut" x="96" y="962">configs.params."server.insecure" = true</text>
  <text class="mut" x="96" y="978">reach it with kubectl port-forward</text>

  <rect x="464" y="866" width="352" height="122" rx="6" fill="#FFFFFF" stroke="#C7DAF7"/>
  <rect x="480" y="880" width="126" height="22" rx="11" fill="#326CE5"/>
  <text class="chip" x="543" y="896" text-anchor="middle">ns: monitoring</text>
  <text class="lbl" x="480" y="926" font-weight="700">kube-prometheus-stack  56.21.0</text>
  <text class="mut" x="480" y="944">Prometheus &#183; Grafana &#183; Alertmanager</text>
  <text class="mut" x="480" y="962">all ClusterIP &#183; helm timeout 600s</text>
  <text class="mut" x="480" y="978">persistent storage via the EBS CSI driver</text>

  <rect x="848" y="866" width="352" height="122" rx="6" fill="#FFFFFF" stroke="#C7DAF7"/>
  <rect x="864" y="880" width="132" height="22" rx="11" fill="#326CE5"/>
  <text class="chip" x="930" y="896" text-anchor="middle">ns: kube-system</text>
  <text class="lbl" x="864" y="926" font-weight="700">aws-ebs-csi-driver  (EKS addon)</text>
  <text class="mut" x="864" y="944">uses IRSA role above &#8212; no static keys</text>
  <text class="mut" x="864" y="962">VPC CNI gives pods real subnet IPs</text>
  <text class="mut" x="864" y="978">CoreDNS &#183; kube-proxy</text>

  <!-- ===== Footer ===== -->
  <text class="tiny" x="32" y="1050">*  terraform.tfvars sets disk_size = 30, but main.tf never passes it to module.eks &#8212; nodes are built with the module default of 20 GiB.</text>
  <text class="tiny" x="1248" y="1050" text-anchor="end">Source: projects/Infrastructure/*.tf</text>
</svg>
